# SonarCloud. The project must exist there and SONAR_TOKEN must be an Actions secret before the
# scan does anything — until then the workflow self-skips and the pipeline stays green.
sonar.projectKey=europe-historical-atlas
sonar.organization=fubaritico

# Only the packages hold product code.
sonar.sources=packages

# Excluded on purpose. The principle: **generated data is not source code.**
#   **/public/**  the served payloads — rivers, DEM, land mask, borders. `europe-rivers.json` alone
#                 is 33 352 lines of Natural Earth geometry: 82 % of what Sonar was measuring, and
#                 not one line of it was written by anyone. Analysing it produces no finding and
#                 consumes the organisation's whole line allowance.
#   files/        plans and spikes. A spike is a dated experiment that answered one question — its
#                 debt is not the product's, and counting it would drown the signal.
#   opensrc/      vendored dependency sources, read-only, never ours.
#   *.test.ts     tests are measured through coverage, not analysed as product code.
sonar.exclusions=**/node_modules/**,**/bench/**,**/dist/**,**/coverage/**,**/public/**,**/*.test.ts,**/*.test.tsx,files/**,opensrc/**

# Still one report, and still this path — but it is now assembled rather than produced.
#
# Each package runs its own Vitest and writes its own `coverage/lcov.info`, in which Vitest records paths
# relative to *that package* (`SF:src/data/assetError.ts`). Sonar resolves them against the repository root, so
# pointed at those files directly it would find nothing and report **0 % with no error** — a wrong number that
# looks like a real one. `scripts/merge-coverage.mjs` rewrites every path to be repo-relative and concatenates
# the reports here; `pnpm coverage` runs it. Verified: 98 paths, all resolving from the root.
#
# Listing the three reports comma-separated is the other way, and Sonar does accept a list. It was declined
# because whether it resolves package-relative paths could only be found out by pushing, and its failure mode
# is that same silent zero.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
