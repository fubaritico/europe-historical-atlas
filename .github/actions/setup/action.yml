name: Setup Node & pnpm
description: Shared setup for every job — pnpm, Node (cached), frozen install. No pre-build; `core` is consumed as TypeScript source, so nothing has to be built before lint, type-check or test.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.7.1

    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
