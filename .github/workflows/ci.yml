name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run. Needed more often than it looks: a job can fail on something outside the
  # code — a secret that was wrong, a service that was down — and without this the only way to
  # retry is an empty commit.
  workflow_dispatch:

# Every job that installs reads `@fubaritico/*` from GitHub Packages, so it needs `packages: read`.
# The repository's default token is write-all, which already covers it — these blocks narrow each
# installing job to what it uses instead. A called workflow cannot exceed its caller's permissions,
# which is why they sit here and not in the called files.
jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/validate.yml

  build:
    needs: [validate]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build.yml

  # Informational, never blocking. Sonar fails for reasons that have nothing to do with the code —
  # a line-of-code quota on the organisation, an expired token, the service being down. Treating
  # "Sonar could not run" as "the code is bad" would stop a release for an accounting problem.
  # When the analysis does run, its own quality gate is read on the platform, not here.
  sonarqube:
    needs: [build]
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  quality-gate:
    runs-on: ubuntu-latest
    needs: [validate, build, sonarqube]
    if: always()
    steps:
      - name: Check every gate
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Quality gate failed (validate=${{ needs.validate.result }}, build=${{ needs.build.result }})"
            exit 1
          fi
          # Sonar is reported, never blocking — see the note on the job above.
          if [ "${{ needs.sonarqube.result }}" == "failure" ]; then
            echo "⚠️  Sonar did not complete. That is an availability problem (quota, token, service),"
            echo "    not a verdict on the code, so it does not stop the release."
          fi
          echo "✅ Quality gate passed (sonarqube=${{ needs.sonarqube.result }})"

  # Deploys the artefact the build job produced — never a rebuild. That is the whole point: the
  # build asserts that the worker chunk carries no three.js and that no GPL-3.0 geometry reached
  # `dist/`, and those assertions only mean something if the bytes that were checked are the bytes
  # that get served. `_headers` and `_redirects` travel inside the artefact for the same reason.
  #
  # Self-skips while the Netlify secrets are absent, so the pipeline is green before the site exists.
  deploy:
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Check Netlify secrets presence
        id: check
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: echo "has=$([ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Download the artefact the gate approved
        if: steps.check.outputs.has == 'true'
        uses: actions/download-artifact@v8
        with:
          name: atlas-${{ github.sha }}
          path: site

      # Diagnostic, never blocking. `Unauthorized: could not retrieve project` has two causes that
      # need opposite fixes — a site id that is wrong (or has whitespace in it), or a token that
      # belongs to a different Netlify account or team than the one owning the site. This prints both
      # sides, so the next failure names its own cause instead of costing another round trip. It cost
      # three hours once, and the message does not say which of the two is at fault.
      - name: What this token can reach
        if: steps.check.outputs.has == 'true'
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          echo "id length: ${#NETLIFY_SITE_ID} characters (a Netlify id is 36)"
          echo "id starts with: ${NETLIFY_SITE_ID:0:8}"
          echo "--- sites this token can administer ---"
          npx --yes netlify-cli@latest sites:list --json > /tmp/sites.json 2>/dev/null || true
          node -e 'const s=require("/tmp/sites.json");s.forEach(x=>console.log(x.id,x.name))' \
            || echo "could not list the sites"

      - name: Deploy to Netlify
        if: steps.check.outputs.has == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Through the environment, never interpolated into the script. A commit message is
          # attacker-controlled text: `${{ ... }}` pastes it raw into the shell, so a backtick or a
          # `$(...)` in a message would execute. Multi-line messages also simply broke the command.
          # Only the subject line is kept — a deploy label wants one line.
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          subject=${COMMIT_SUBJECT%%$'\n'*}
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir=site \
            --site="$NETLIFY_SITE_ID" \
            --message "${COMMIT_SHA:0:7} — $subject"

      - name: Skip notice
        if: steps.check.outputs.has != 'true'
        run: echo "ℹ️ NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID absent — deploy skipped. Add both secrets to enable it."
