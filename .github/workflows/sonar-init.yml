name: Initialize SonarCloud Project

# Manual, one shot. Run it once after registering the project on SonarCloud and adding the
# SONAR_TOKEN secret: it seeds the project from the default branch so later scans have a baseline
# to compare "new code" against.
on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Generate coverage (lcov for Sonar)
        run: pnpm coverage

      - name: Seed SonarCloud from the default branch
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
