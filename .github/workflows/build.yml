name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Builds every app, not only the atlas — `pnpm build` is `turbo build`, and each app's `build`
      # waits on its own `type-check` first. Compiling the Cartographer here earns its seconds: `tsc`
      # cannot see a missing asset, because `vite/client` declares `*.png` and `*.css` as ambient
      # modules, so an import of a file that is not there type-checks green and only `vite build`
      # says otherwise.
      #
      # The artefact below is still the atlas alone, because it is the only app that is deployed.
      - name: Build the apps
        run: pnpm build

      # The property this project cannot afford to lose silently: the compute worker must ship
      # without three.js in it. A bundle boundary is invisible in a diff, so it is asserted here.
      - name: The worker chunk must not contain three.js
        run: |
          worker=$(ls packages/atlas/dist/assets/computeWorker-*.js)
          echo "worker chunk: $worker ($(wc -c < "$worker") bytes)"
          if grep -q "WebGLRenderer" "$worker"; then
            echo "::error::three.js leaked into the compute worker chunk"
            exit 1
          fi
          echo "✅ no renderer in the worker chunk"

      # `public/` is copied wholesale into `dist/`, and `public/borders/` holds GPL-3.0 geometry.
      # It is git-ignored, so it is absent here — but that makes the guarantee an absence rather
      # than a check. If those files are ever committed, this turns red before anything ships.
      #
      # Every package's `dist`, not the atlas's alone: since 2026-10-07 the Cartographer's
      # `publicDir` is the atlas's own, so it produces a second output carrying the same files. A
      # guard naming one package would have gone quiet the moment a second one appeared — which is
      # the exact shape of the 2026-09-24 incident, where an ignore pattern stopped matching in
      # silence after a directory moved.
      - name: No GPL-3.0 geometry in any build output
        run: |
          found=$(find packages/*/dist -maxdepth 1 -type d -name borders 2>/dev/null)
          if [ -n "$found" ]; then
            echo "::error::GPL-3.0 border payloads reached a build output. Publishing them would put the whole distributed work under the GPL."
            echo "$found"
            exit 1
          fi
          echo "✅ no GPL geometry in any build output"

      - uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ github.sha }}
          path: packages/atlas/dist
          retention-days: 7
          if-no-files-found: error
