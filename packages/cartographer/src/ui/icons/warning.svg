    <!-- Fond du triangle avec le dégradé -->
    <path d="M 223.7 26.8 C 235.3 6.7 264.7 6.7 276.3 26.8 L 489.1 395.2 C 500.7 415.3 486.2 430 462.8 430 L 37.2 430 C 13.8 430 -0.7 415.3 10.9 395.2 Z" fill="url(#warningGrad)" />

