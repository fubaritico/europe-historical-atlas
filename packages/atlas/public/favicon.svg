<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Europe — Historical Atlas">
  <!--
    The lambda that already stands in for the A in HISTORICΛL ΛTLΛS, reduced to a mark.

    Both colours are taken from the atlas rather than chosen: #efe6d2 is the page's own vellum
    (index.html), and #5c3a2e is the border casing's brown — the most used ink in the codebase.

    Drawn as a stroked path, not a text glyph: a favicon is rasterised at 16 px by a renderer whose
    fonts we do not control, and a missing Greek face would silently fall back to a box.
  -->
  <rect width="32" height="32" fill="#efe6d2" />
  <path
    d="M5.5 25.5 L16 6.5 L26.5 25.5"
    fill="none"
    stroke="#5c3a2e"
    stroke-width="5"
    stroke-linejoin="miter"
    stroke-linecap="butt"
  />
</svg>
