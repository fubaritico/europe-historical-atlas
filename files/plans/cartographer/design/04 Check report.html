<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartographer — 04 check report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<div class="app">
  <header class="appbar" data-shell="appbar"></header>
  <div class="docbar" data-shell="docbar"></div>

  <div class="body" style="--dock-w:430px">
    <aside class="rail" data-shell="rail"></aside>

    <main class="canvas" style="background-size:4000px auto;background-position:-1280px -1906px">
      <div class="artboard-label">1100 — framed on Lyon</div>
      <div class="artboard"></div>
      <div class="zoombox" role="group" aria-label="Zoom" data-zoombox></div>
      <div class="canvas-note mono">CANVAS — code. Framed on the selected row: Lyon, with the Kingdom of France’s and the Holy Roman Empire’s borders both visible.</div>
    </main>

    <aside class="dock">
      <section class="group" data-panel-name="Check">
        <div class="tabs" role="tablist" aria-label="Document panels">
          <button role="tab" aria-selected="true">Check · 1100</button>
          <button role="tab" aria-selected="false" class="hoverable">Polities</button>
          <span class="grow"></span>
          <span class="dim" style="display:flex;align-items:center;padding:0 8px;font-size:11px">checked just now · compared with yesterday</span>
        </div>

        <div class="panel" role="tabpanel" aria-label="Check report">
          <div style="padding:10px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line)">
            <div class="verdict" data-publishable="false" role="status">
              <span class="word mono">publishable: no</span>
              <span class="reason">2 stretches are derived from a GPL-3.0 geometry. Nothing else below blocks publishing.</span>
            </div>
            <div class="tiles" id="tiles"></div>
          </div>
          <div id="findings"></div>
        </div>
      </section>
    </aside>
  </div>

  <footer class="status" data-shell="status"></footer>
</div>

<script src="chrome.js"></script>
<script src="mock-data.js"></script>
<script src="screen.js"></script>
<script>
  Screen.build({
    file: 'europe-1100.json', year: 1100, zoom: '92 %', zoomStatus: '92 %', modified: true,
    tool: 'navigate', swatch: '#c99a45', undo: 'move anchor', redo: null,
    coords: '4°50′E 45°45′N', holder: 'Kingdom of France · kingdom', scale: '3.2 km/px',
    totals: '52 polities · 17 104 vertices · unclaimed land 41 %'
  })

  const TILES = [
    ['unclaimed land', '55 % → 41 %'],
    ['no provenance', '11.8 % → 6.2 %'],
    ['fixed since yesterday', '14']
  ]

  /**
   * A finding: what is wrong, where, and the way out.
   * `accept` marks the ones a human may declare correct — an overlap or an unclaimed region can be
   * a historical fact, and only the author knows. A broken ring never can.
   */
  const row = (what, where, fix, options = {}) => ({ what, where, fix, ...options })

  const GROUPS = [
    { title: 'Derived from a GPL-3.0 geometry', note: 'blocks publishing', blocking: true, rows: [
      row('Byzantine Empire — stretch taken from historical-basemaps', 'Thrace coast · 42 anchors', 'Redraw it: snap to the coast, or report it by eye.'),
      row('Kingdom of Hungary — stretch taken from historical-basemaps', 'Carpathians · 118 anchors', 'Redraw it by eye from a reference you may use.')
    ]},
    { title: 'Cities on the wrong side', note: 'witness list', rows: [
      row('Lyon — expected Holy Roman Empire, drawn in Kingdom of France', '4°50′E 45°45′N', 'Move France’s eastern limit west of Lyon, onto the Saône.', { selected: true }),
      row('Besançon — expected Holy Roman Empire, drawn in unclaimed', '6°01′E 47°14′N', 'Extend the Empire’s outline over Besançon.')
    ]},
    { title: 'Overlaps', note: 'between peers', rows: [
      row('Kingdom of Poland and Holy Roman Empire claim the same ground', 'Lusatia · 640 km²', 'Take the ground, leave it, or adjust one outline.', { accept: true })
    ]},
    { title: 'Broken geometry', note: '', rows: [
      row('Kingdom of Dublin — ring 3 has 3 vertices', '6°15′W 53°21′N', 'A ring needs at least 4 anchors: add one, or delete the ring.'),
      row('Principality of Antioch — ring 1 crosses itself', '36°12′E 36°10′N', 'Move the crossing anchors apart.')
    ]},
    { title: 'Slivers', note: 'narrower than two cells', rows: [
      row('Unclaimed strip between Kingdom of France and Holy Roman Empire', 'Meuse · 48 km long', 'Duplicate the Empire’s path along the Meuse into France.')
    ]},
    { title: 'Stretches with no provenance', note: '6.2 % of border length', rows: [
      row('Kingdom of Hungary — 14 stretches', '310 km', 'Record a source for each, or redraw by snapping.'),
      row('Kingdom of Croatia — 5 stretches', '96 km', 'Record a source for each, or redraw by snapping.')
    ]},
    { title: 'No name in French', note: 'the atlas would fall back to English', rows: [
      row('Volga Bulgaria', 'registry', 'Add a French name in the polity form.'),
      row('Sultanate of Rum', 'registry', 'Add a French name in the polity form.')
    ]},
    { title: 'Unclaimed land', note: '41 % of land, by surface · biggest first', rows: [
      row('Castile and León', '94 800 km²', 'Draw the polity that held it, or accept it as unclaimed.', { accept: true }),
      row('Kievan Rus’, northern half', '88 300 km²', 'Draw the polity that held it, or accept it as unclaimed.', { accept: true }),
      row('Bohemia', '52 100 km²', 'Draw the polity that held it, or accept it as unclaimed.', { accept: true }),
      row('Denmark', '43 000 km²', 'Draw the polity that held it, or accept it as unclaimed.', { accept: true })
    ]}
  ]

  document.getElementById('tiles').innerHTML = TILES
    .map(([label, value]) => `<div class="tile"><span class="label">${label}</span><span class="value mono">${value}</span></div>`)
    .join('')

  document.getElementById('findings').innerHTML = GROUPS.map((group) => `
    <section class="finding-group">
      <div class="head">
        <span class="title">${Chrome.escape(group.title)}</span>
        <span class="mono note">${group.rows.length}</span>
        <span class="grow"></span>
        <span class="note">${Chrome.escape(group.note)}</span>
      </div>
      ${group.rows.map((r) => `
        <div class="finding" role="button" tabindex="0" title="Frame on the canvas" ${r.selected ? 'aria-selected="true"' : ''}>
          <span class="what">${Chrome.escape(r.what)}</span>
          <span class="where mono">${Chrome.escape(r.where)}</span>
          ${r.accept ? '<button>Accept</button>' : '<span></span>'}
          <span class="fix">${Chrome.escape(r.fix)}</span>
        </div>`).join('')}
    </section>`).join('') + `
    <div style="margin:10px 12px 0;padding-top:9px;border-top:1px solid var(--line);font-size:11px" class="dim">
      Nothing found: polities outside their existence interval · rings outside the frame.
    </div>
    <section class="finding-group" style="margin-top:12px">
      <div class="head">
        <span class="title">Accepted</span><span class="mono note">1</span>
        <span class="grow"></span><span class="note">not reported again</span>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:2px 12px;margin:0 12px 12px;padding:6px 8px;border:1px dashed var(--line)">
        <span>Brittany unclaimed</span><span class="mono" style="font-size:11px">31 200 km²</span>
        <span class="dim" style="font-size:11px">Reason: “historically correct in 1100”</span>
      </div>
    </section>`
</script>
</body>
</html>
